apiVersion: apps/v1
kind: Deployment

metadata:
  name: nginx-deployment
  labels:
    depl: nginx-deployment

spec:
  replicas: 3

  selector:
    matchLabels:
      app: nginx-deployment
    
  template:
    metadata:
      labels:
        app: nginx-deployment
        environment: learning

    spec:
      containers:
        - name: nginx
          image: nginx:latest