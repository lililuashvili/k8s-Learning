apiVersion: apps/v1
kind: Deployment

metadata:
  name: busybox-test

spec:
  replicas: 1

  selector:
    matchLabels:
      app: busybox-test

  template:
    metadata:
      labels:
        app: busybox-test
    spec:
      containers:
        - name: busybox
          image: busybox:1.36
          command: ["sh", "-c", "echo starting; sleep 2; exit 1"]